pay(){const b=$('#paybtn');if(!b||b.disabled)return;const t=totals();b.disabled=true;b.innerHTML='<div class="spin"></div>Processing demo payment';setTimeout(()=>{const o={id:'QX-'+(1043+S.orders.length),total:t.tot,m:{card:'Card',stars:'Stars',ton:'TON'}[S.pay],st:'Processing',d:'Today',n:1};S.orders.push(o);S.pts=Math.round(S.pts-t.pu*100+t.tot*t.L.m);if(S.disc&&t.rd)S.disc=0;S.usePts=false;S.cart=[];mb(0);$('#sh').innerHTML=`<div class="grab"></div><div style="text-align:center;padding:20px 0"><div class="av" style="margin:0 auto 18px;background:linear-gradient(135deg,#19dca0,#0a9e74);width:84px;height:84px;border-radius:50%">${ic('check',40)}</div><h2>Order confirmed</h2><p class="mu mt mb">${o.id} · demo payment. You earned ${Math.round(t.tot*t.L.m)} points and ${Math.round(t.tot/2)} XP.</p><button class="btn v" data-a="close">Done</button></div>`;ok();render();addXP(Math.round(t.tot/2));render()},1600)},

open(v){const c=S.cases.find(x=>x.id==S.selCase),t=v=='t';if(lvl()<c.lv||!c.on)return;if(t&&S.tix<1)return;if(t)S.tix--;let w=Object.assign({},c.w);if(t){w.common=Math.max(0,w.common-20);w.epic+=12;w.legendary+=8}let r=S.force||roll(w);S.force='';const rw=reward(r);caseAnim(c,r,rw,w)},
redeem(v){const r=S.inv[v];if(r.k=='disc'){S.disc=Math.max(S.disc,r.v);toast(r.v+'% discount applied to next order','gem')}else{S.cart.push({pid:r.pid,c:P(r.pid).cols[0],s:P(r.pid).sz[0],qty:1,free:1});toast('Reward added to cart','bag')}S.inv.splice(v,1);render()},
caseok(){$('#full').className='full';render()},lvlclose(){$('#full').className='full';render()},
claim(){const R=[[20],[25],[30,1],[40],[50],[60],[100,1,200]][S.di];S.claimed=true;S.streak++;S.di=(S.di+1)%7;if(R[1])S.tix++;if(R[2])S.pts+=R[2];S.pts+=25;render();toast('+'+R[0]+' XP'+(R[1]?' and a case ticket':''),'bolt');addXP(R[0]);render()},nextday(){S.claimed=false;render()},
ptsd(v){const[c,d]=v.split(':').map(Number);if(S.pts<c)return toast('Not enough points','lock');S.pts-=c;S.disc=Math.max(S.disc,d);render();toast(d+'% discount ready','gem')},
copy(){try{navigator.clipboard.writeText(link())}catch(e){}toast('Referral link copied','copy')},

atab(v){S.adm=v;render()},delp(v){S.prods=S.prods.filter(p=>p.id!=v);render()},addp(){const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!p)return toast('Enter name and price','x');S.prods.unshift({id:S.nid++,n,cat:$('#ac').value,t:$('#ac').value=='Clothing'?'tee':'bag',p,cols:['black','bone'],tag:'New',sz:$('#ac').value=='Clothing'?['S','M','L','XL']:['One size']});render();toast('Product added')},

ctog(v){const c=S.cases.find(x=>x.id==v);c.on=!c.on;render()},force(v){S.force=v;render()},ost(v){const o=S.orders.find(x=>x.id==v);o.st={Processing:'Shipped',Shipped:'Delivered',Delivered:'Processing'}[o.st];render()}};
function roll(w){let t=Object.values(w).reduce((a,b)=>a+b,0),x=Math.random()*t;for(const k in w){if((x-=w[k])<0)return k}return'common'}
function reward(r){const pool={common:['d3','p75'],rare:['d5','iA'],epic:['d10','iC'],legendary:['d20','iP']}[r],k=pool[Math.floor(Math.random()*2)];if(k[0]=='d')return{k:'disc',v:+k.slice(1),t:k.slice(1)+'% discount',r};if(k[0]=='p')return{k:'pts',v:75,t:'75 QNEX Points',r};const L=S.prods.filter(p=>k=='iA'?p.cat=='Accessories':k=='iP'?p.p>140:true),p=L[Math.floor(Math.random()*L.length)]||S.prods[0];return{k:'item',pid:p.id,t:p.n,r}}
function caseAnim(c,r,rw,w){const f=$('#full'),W=Math.min(innerWidth,560),names=['Axis Tee','Cap','Hoodie','Tote','Pant','Discount','Points','Shell'];const tiles=[];for(let i=0;i<40;i++){const rr=i==34?r:roll(w);tiles.push(`<div class="tile" style="--rc:${RC[rr][0]}">${ic(i==34?(rw.k=='item'?'bag':rw.k=='disc'?'gem':'bolt'):['bag','gem','bolt','star'][i%4],30)}</div>`)}
f.className='full on';f.innerHTML=`<div class="mu sm">${c.n} case</div><h2 class="mb">Opening</h2><div class="reel"><div class="strip" id="strip">${tiles.join('')}</div></div><div id="res" style="min-height:230px"></div>`;
const st=$('#strip'),off=34*106-(W-48)/2+48-(Math.random()*60-30);st.style.transform='translateX(0)';requestAnimationFrame(()=>requestAnimationFrame(()=>{st.style.transition='transform 4.6s cubic-bezier(.12,.72,.08,1)';st.style.transform=`translateX(-${off}px)`}));

setTimeout(()=>{clearInterval(iv);ok();S.hist.unshift({r,t:rw.t,c:c.n});if(rw.k=='pts')S.pts+=75;else S.inv.unshift(rw);$('#res').innerHTML=`<div class="reveal" style="--rc:${RC[r][0]};margin:0 auto"><span class="rar" style="color:${RC[r][0]}">${RC[r][1]}</span><h2 style="margin:14px 0 6px">${rw.t}</h2><p class="mu sm mb">${rw.k=='item'?'Voucher added to inventory':rw.k=='disc'?'Discount added to inventory':'Points added to balance'}</p><button class="btn v" data-a="caseok">Collect</button></div>`;addXP(20)},5000)}
